<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nombre del Local</title>
<meta name="description" content="Descripción corta del local para Google.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ═══════════════════════════════════════════════════════════
   COLORES — cambiá estos 4 valores y cambia toda la página
   ═══════════════════════════════════════════════════════════ */
:root{
  --marca:      #1f4d3d;   /* color principal (botones, menú) */
  --marca-osc:  #15352a;   /* variante oscura del principal   */
  --acento:     #d4a24a;   /* color de detalle (líneas, íconos)*/
  --fondo:      #faf7f2;   /* fondo de la página              */
  --texto:      #22201d;
  --texto-sec:  #6b6560;
  --borde:      #e6dfd4;
  --radio: 14px;
  --ancho: 1060px;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:80px}
body{
  font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  background:var(--fondo);color:var(--texto);line-height:1.65;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,.display{font-family:'Fraunces','Georgia',serif;font-weight:600;line-height:1.15;letter-spacing:-.01em}
img{max-width:100%;display:block}
a{color:inherit}
.wrap{max-width:var(--ancho);margin:0 auto;padding:0 22px}

/* ─────────── BARRA SUPERIOR + 3 RAYITAS ─────────── */
.barra{
  position:fixed;top:0;left:0;right:0;z-index:60;
  display:flex;align-items:center;justify-content:space-between;
  padding:14px 22px;
  transition:background .3s ease, box-shadow .3s ease;
}
.barra.solida{background:rgba(250,247,242,.94);backdrop-filter:blur(12px);box-shadow:0 1px 0 var(--borde)}
.barra-nombre{
  font-family:'Fraunces',serif;font-size:1.05rem;font-weight:600;
  text-decoration:none;opacity:0;transform:translateY(-6px);
  transition:opacity .3s ease,transform .3s ease;pointer-events:none;
}
.barra.solida .barra-nombre{opacity:1;transform:none;pointer-events:auto}

/* el botón de las 3 rayitas */
.rayitas{
  width:48px;height:48px;border:none;background:rgba(255,255,255,.9);
  border-radius:50%;cursor:pointer;display:grid;place-content:center;gap:5px;
  box-shadow:0 2px 12px rgba(0,0,0,.12);z-index:80;
  transition:background .25s ease;
}
.barra.solida .rayitas{box-shadow:0 1px 6px rgba(0,0,0,.08)}
.rayitas span{
  display:block;width:20px;height:2px;background:var(--texto);border-radius:2px;
  transition:transform .3s cubic-bezier(.4,0,.2,1),opacity .2s ease;
}
.rayitas.abierto span{background:#fff}
.rayitas.abierto span:nth-child(1){transform:translateY(7px) rotate(45deg)}
.rayitas.abierto span:nth-child(2){opacity:0}
.rayitas.abierto span:nth-child(3){transform:translateY(-7px) rotate(-45deg)}
.rayitas.abierto{background:transparent;box-shadow:none}

/* ─────────── MENÚ DESPLEGABLE ─────────── */
.menu{
  position:fixed;inset:0;z-index:70;background:var(--marca);
  display:flex;flex-direction:column;justify-content:center;align-items:center;
  gap:6px;opacity:0;visibility:hidden;transition:opacity .35s ease,visibility .35s;
}
.menu.abierto{opacity:1;visibility:visible}
.menu a{
  font-family:'Fraunces',serif;font-size:clamp(1.7rem,7vw,2.5rem);
  color:#fff;text-decoration:none;padding:10px 20px;
  opacity:0;transform:translateY(14px);
  transition:opacity .4s ease,transform .4s ease,color .2s ease;
}
.menu.abierto a{opacity:1;transform:none}
.menu.abierto a:nth-child(1){transition-delay:.08s}
.menu.abierto a:nth-child(2){transition-delay:.14s}
.menu.abierto a:nth-child(3){transition-delay:.20s}
.menu.abierto a:nth-child(4){transition-delay:.26s}
.menu.abierto a:nth-child(5){transition-delay:.32s}
.menu a:hover,.menu a:focus{color:var(--acento)}
.menu-tel{
  margin-top:26px;font-family:'Inter',sans-serif!important;font-size:1rem!important;
  border:1px solid rgba(255,255,255,.35);border-radius:99px;padding:12px 30px!important;
}

/* ─────────── PORTADA ─────────── */
.portada{
  min-height:100svh;display:flex;flex-direction:column;
  justify-content:center;align-items:center;text-align:center;
  padding:110px 22px 130px;position:relative;overflow:hidden;
}
.portada-fondo{
  position:absolute;inset:0;z-index:-2;
  background-color:var(--marca-osc);   /* se ve esto si la foto tarda o falla */
  background-size:cover;background-position:center;
}
.portada-velo{position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,rgba(0,0,0,.45),rgba(0,0,0,.62))}
.portada.con-foto{color:#fff}
.portada.con-foto .rubro,.portada.con-foto .frase{color:rgba(255,255,255,.86)}
.rubro{
  text-transform:uppercase;letter-spacing:.22em;font-size:.72rem;font-weight:600;
  color:var(--texto-sec);margin-bottom:22px;
}
.portada h1{font-size:clamp(2.6rem,11vw,5rem);margin-bottom:18px}
.frase{font-size:clamp(1rem,3.5vw,1.2rem);color:var(--texto-sec);max-width:34ch;margin:0 auto 34px}

/* BOTÓN RESERVAR — el más importante */
.btn-reservar{
  display:inline-flex;align-items:center;gap:10px;
  background:var(--marca);color:#fff;text-decoration:none;
  font-size:1.05rem;font-weight:600;padding:17px 42px;border-radius:99px;
  box-shadow:0 6px 22px rgba(0,0,0,.22);
  transition:transform .2s ease,box-shadow .2s ease,background .2s ease;
}
.btn-reservar:hover{background:var(--marca-osc);transform:translateY(-2px);box-shadow:0 10px 28px rgba(0,0,0,.28)}
.btn-reservar:active{transform:translateY(0)}
.btn-sec{
  display:inline-flex;align-items:center;gap:8px;margin-top:16px;
  font-size:.95rem;text-decoration:none;color:inherit;opacity:.85;
  border-bottom:1px solid currentColor;padding-bottom:2px;
}
.botonera{display:flex;flex-direction:column;align-items:center}

/* ─────────── SECCIONES ─────────── */
section{padding:78px 0;border-top:1px solid var(--borde)}
.eyebrow{
  text-transform:uppercase;letter-spacing:.18em;font-size:.68rem;font-weight:600;
  color:var(--acento);margin-bottom:12px;
}
section h2{font-size:clamp(1.8rem,6vw,2.5rem);margin-bottom:22px}
section p{color:var(--texto-sec);max-width:62ch;font-size:1.02rem}
section p + p{margin-top:14px}

/* CARTA / PRECIOS */
.grupo{margin-top:38px}
.grupo h3{font-size:1.15rem;margin-bottom:4px;color:var(--marca)}
.grupo-linea{height:1px;background:var(--borde);margin-bottom:16px}
.item{display:flex;justify-content:space-between;align-items:baseline;gap:14px;padding:11px 0}
.item + .item{border-top:1px dotted var(--borde)}
.item-nom{font-weight:500}
.item-desc{display:block;font-size:.87rem;color:var(--texto-sec);font-weight:400;margin-top:2px}
.item-precio{font-weight:600;color:var(--marca);white-space:nowrap;font-variant-numeric:tabular-nums}

/* UBICACIÓN / HORARIOS */
.dosdatos{display:grid;grid-template-columns:1fr;gap:34px;margin-top:30px}
@media(min-width:820px){.dosdatos{grid-template-columns:1fr 1fr;gap:44px}}
.dato{margin-bottom:20px}
.dato-tit{font-size:.7rem;text-transform:uppercase;letter-spacing:.14em;color:var(--texto-sec);margin-bottom:5px;font-weight:600}
.dato-val{font-size:1.05rem;font-weight:500}
.dato-val a{text-decoration:none;border-bottom:1px solid var(--acento)}
.horarios{list-style:none}
.horarios li{display:flex;justify-content:space-between;padding:8px 0;font-size:.96rem}
.horarios li + li{border-top:1px dotted var(--borde)}
.horarios span:last-child{color:var(--texto-sec)}
.mapa{width:100%;height:320px;border:0;border-radius:var(--radio);box-shadow:0 3px 16px rgba(0,0,0,.07)}

/* PIE */
footer{background:var(--marca);color:#fff;padding:52px 0 110px;text-align:center}
footer h3{font-size:1.6rem;margin-bottom:10px}
footer p{color:rgba(255,255,255,.72);font-size:.93rem;margin-bottom:22px}
.footer-btn{
  display:inline-block;background:#fff;color:var(--marca);text-decoration:none;
  font-weight:600;padding:14px 34px;border-radius:99px;
}
.credito{margin-top:34px;font-size:.76rem;color:rgba(255,255,255,.42)}

/* BARRA FIJA ABAJO EN CELULAR */
.barra-abajo{
  position:fixed;bottom:0;left:0;right:0;z-index:50;
  display:grid;grid-template-columns:1fr 1fr;
  background:#fff;border-top:1px solid var(--borde);
  box-shadow:0 -3px 16px rgba(0,0,0,.09);
}
.barra-abajo a{
  padding:16px 8px;text-align:center;text-decoration:none;
  font-size:.92rem;font-weight:600;
}
.barra-abajo a:first-child{color:var(--marca);border-right:1px solid var(--borde)}
.barra-abajo a:last-child{background:var(--marca);color:#fff}
@media(min-width:820px){.barra-abajo{display:none}footer{padding-bottom:52px}}
</style>
</head>
<body>

<!-- BARRA SUPERIOR con las 3 rayitas -->
<div class="barra" id="barra">
  <a href="#top" class="barra-nombre" id="barraNombre"></a>
  <button class="rayitas" id="btnMenu" aria-label="Abrir menú" aria-expanded="false">
    <span></span><span></span><span></span>
  </button>
</div>

<!-- MENÚ -->
<nav class="menu" id="menu"></nav>

<!-- PORTADA -->
<header class="portada" id="top">
  <div class="portada-fondo" id="portadaFondo"></div>
  <div class="portada-velo" id="portadaVelo" style="display:none"></div>
  <p class="rubro" id="rubro"></p>
  <h1 id="nombre"></h1>
  <p class="frase" id="frase"></p>
  <div class="botonera">
    <a class="btn-reservar" id="btnReservar">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 1.9.7 2.8a2 2 0 0 1-.5 2.1L8.1 9.9a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.8.7a2 2 0 0 1 1.7 2z"/></svg>
      <span id="txtReservar">Reservar</span>
    </a>
    <a class="btn-sec" id="btnWhats">Escribinos por WhatsApp</a>
  </div>
</header>

<main id="contenido"></main>

<footer>
  <div class="wrap">
    <h3 id="pieTitulo"></h3>
    <p id="pieTexto"></p>
    <a class="footer-btn" id="pieBtn"></a>
    <p class="credito" id="credito"></p>
  </div>
</footer>

<!-- BARRA FIJA ABAJO (solo celular) -->
<div class="barra-abajo">
  <a id="abajoMapa">Cómo llegar</a>
  <a id="abajoTel">Reservar</a>
</div>

<script>
/* ══════════════════════════════════════════════════════════════════
   ▼▼▼  ACÁ SE EDITA TODO. NO HACE FALTA TOCAR NADA MÁS.  ▼▼▼
   ══════════════════════════════════════════════════════════════════ */
const LOCAL = {

  nombre:   "Bodegón Charcas",
  rubro:    "Parrilla y cocina de barrio · Palermo",
  frase:    "Cincuenta años haciendo el mismo bife. Mesa larga, mantel de papel y sobremesa sin apuro.",

  telefono:      "+541148990000",
  telefonoLindo: "11 4899-0000",
  whatsapp:      "5491148990000",
  mensajeWhats:  "Hola! Quería reservar una mesa.",
  textoBotón:    "Reservar mesa",

  direccion: "Charcas 4145, Palermo, CABA",
  email:     "reservas@bodegoncharcas.com.ar",
  instagram: "",

  fotoPortada: "https://images.unsplash.com/photo-1544025162-d76694265947?auto=format&fit=crop&w=1600&q=70",

  horarios: [
    ["Lunes a jueves",   "12:00 – 15:30 · 20:00 – 00:00"],
    ["Viernes y sábado", "12:00 – 16:00 · 20:00 – 01:00"],
    ["Domingo",          "12:00 – 16:30"],
  ],

  secciones: [

    { id:"nosotros", menu:"Quiénes somos", tipo:"texto",
      titulo:"Quiénes somos",
      eyebrow:"La casa",
      parrafos:[
        "Abrimos en 1974 en la esquina de Charcas y Scalabrini Ortiz y desde entonces cambió el barrio, cambiaron los precios, pero la parrilla es la misma.",
        "Cocina de bodegón sin vueltas: carne a las brasas, pastas caseras los domingos y postres que se hacen todas las mañanas acá adentro.",
        "Somos un local familiar. Si venís con chicos, hay sillitas; si venís solo, hay lugar en la barra."
      ]
    },

    { id:"carta", menu:"Menú y precios", tipo:"carta",
      titulo:"Menú",
      eyebrow:"Nuestra carta",
      intro:"Precios de agosto 2026. Tenemos opciones sin TACC y vegetarianas, consultá al mozo.",
      grupos:[
        { nombre:"Para empezar", items:[
          ["Provoleta a la parrilla","Con orégano, ají molido y aceite de oliva","$8.500"],
          ["Empanadas de carne","Cortadas a cuchillo. Unidad","$2.200"],
          ["Tabla de fiambres","Para dos personas","$14.000"],
        ]},
        { nombre:"De la parrilla", items:[
          ["Bife de chorizo","350 g, con guarnición a elección","$21.000"],
          ["Entraña","Punto a gusto","$23.500"],
          ["Vacío para dos","Con ensalada mixta y papas","$34.000"],
          ["Pollo deshuesado","Al limón y romero","$15.000"],
        ]},
        { nombre:"Cocina", items:[
          ["Milanesa napolitana","Con papas fritas","$16.500"],
          ["Ravioles de ricota","Salsa a elección","$13.000"],
          ["Tortilla de papas","Con ensalada verde","$11.000"],
        ]},
        { nombre:"Postres", items:[
          ["Flan casero","Con dulce de leche y crema","$6.000"],
          ["Panqueque de manzana","Flambeado en la mesa","$7.200"],
        ]},
      ]
    },

    { id:"lugar", menu:"Dónde estamos", tipo:"lugar",
      titulo:"Dónde estamos",
      eyebrow:"Ubicación y horarios"
    },

  ],

  pieTitulo: "Te esperamos",
  pieTexto:  "Reservá por teléfono o pasá directamente. Los fines de semana conviene avisar.",
  credito:   "Sitio de ejemplo — el negocio es ficticio, la dirección es real.",
};
/* ══════════════════════════════════════════════════════════════════
   ▲▲▲  FIN DE LA PARTE EDITABLE  ▲▲▲
   ══════════════════════════════════════════════════════════════════ */


/* ---- De acá para abajo la página se arma sola ---- */
(function(){
  const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const linkTel   = "tel:" + LOCAL.telefono;
  const linkWhats = "https://wa.me/" + LOCAL.whatsapp + "?text=" + encodeURIComponent(LOCAL.mensajeWhats||"");
  const linkMapa  = "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(LOCAL.direccion);

  document.title = LOCAL.nombre + (LOCAL.rubro ? " · " + LOCAL.rubro.split("·")[0].trim() : "");
  document.getElementById("nombre").textContent      = LOCAL.nombre;
  document.getElementById("rubro").textContent       = LOCAL.rubro;
  document.getElementById("frase").textContent       = LOCAL.frase;
  document.getElementById("barraNombre").textContent = LOCAL.nombre;
  document.getElementById("txtReservar").textContent = LOCAL.textoBotón || "Reservar";
  document.getElementById("btnReservar").href        = linkTel;
  document.getElementById("abajoTel").textContent    = LOCAL.textoBotón || "Reservar";
  document.getElementById("abajoTel").href           = linkTel;
  document.getElementById("abajoMapa").href          = linkMapa;

  const bw = document.getElementById("btnWhats");
  if (LOCAL.whatsapp) { bw.href = linkWhats; bw.target = "_blank"; bw.rel = "noopener"; }
  else bw.style.display = "none";

  // foto de portada
  if (LOCAL.fotoPortada){
    document.querySelector(".portada").classList.add("con-foto");
    document.getElementById("portadaFondo").style.backgroundImage = "url('"+LOCAL.fotoPortada+"')";
    document.getElementById("portadaVelo").style.display = "block";
  }

  // ---- menú de las 3 rayitas ----
  const menu = document.getElementById("menu");
  menu.innerHTML =
    LOCAL.secciones.map(s => `<a href="#${esc(s.id)}">${esc(s.menu)}</a>`).join("") +
    `<a class="menu-tel" href="${linkTel}">${esc(LOCAL.telefonoLindo||LOCAL.telefono)}</a>`;

  const btn = document.getElementById("btnMenu");
  const abrirCerrar = forzar => {
    const abierto = forzar !== undefined ? forzar : !menu.classList.contains("abierto");
    menu.classList.toggle("abierto", abierto);
    btn.classList.toggle("abierto", abierto);
    btn.setAttribute("aria-expanded", abierto);
    btn.setAttribute("aria-label", abierto ? "Cerrar menú" : "Abrir menú");
    document.body.style.overflow = abierto ? "hidden" : "";
  };
  btn.addEventListener("click", () => abrirCerrar());
  menu.addEventListener("click", e => { if (e.target.tagName === "A") abrirCerrar(false); });
  document.addEventListener("keydown", e => { if (e.key === "Escape") abrirCerrar(false); });

  // barra sólida al bajar
  const barra = document.getElementById("barra");
  const alScroll = () => barra.classList.toggle("solida", window.scrollY > 120);
  window.addEventListener("scroll", alScroll, {passive:true}); alScroll();

  // ---- secciones ----
  const horariosHTML = () =>
    "<ul class='horarios'>" +
    (LOCAL.horarios||[]).map(([d,h]) => `<li><span>${esc(d)}</span><span>${esc(h)}</span></li>`).join("") +
    "</ul>";

  const dato = (t,v) => `<div class="dato"><div class="dato-tit">${esc(t)}</div><div class="dato-val">${v}</div></div>`;

  const armar = s => {
    let cuerpo = "";
    if (s.tipo === "texto"){
      cuerpo = (s.parrafos||[]).map(p => `<p>${esc(p)}</p>`).join("");
    }
    else if (s.tipo === "carta"){
      cuerpo = (s.intro ? `<p>${esc(s.intro)}</p>` : "") +
        (s.grupos||[]).map(g => `
          <div class="grupo">
            <h3>${esc(g.nombre)}</h3><div class="grupo-linea"></div>
            ${(g.items||[]).map(([n,d,p]) => `
              <div class="item">
                <div class="item-nom">${esc(n)}${d ? `<span class="item-desc">${esc(d)}</span>` : ""}</div>
                <div class="item-precio">${esc(p)}</div>
              </div>`).join("")}
          </div>`).join("");
    }
    else if (s.tipo === "lugar"){
      cuerpo = `<div class="dosdatos">
        <div>
          ${dato("Dirección", `<a href="${linkMapa}" target="_blank" rel="noopener">${esc(LOCAL.direccion)}</a>`)}
          ${dato("Teléfono",  `<a href="${linkTel}">${esc(LOCAL.telefonoLindo||LOCAL.telefono)}</a>`)}
          ${LOCAL.email     ? dato("Email",     `<a href="mailto:${esc(LOCAL.email)}">${esc(LOCAL.email)}</a>`) : ""}
          ${LOCAL.instagram ? dato("Instagram", `<a href="https://instagram.com/${esc(LOCAL.instagram)}" target="_blank" rel="noopener">@${esc(LOCAL.instagram)}</a>`) : ""}
          <div class="dato-tit" style="margin-top:26px">Horarios</div>
          ${horariosHTML()}
        </div>
        <div><iframe class="mapa" loading="lazy" referrerpolicy="no-referrer-when-downgrade"
             src="https://www.google.com/maps?q=${encodeURIComponent(LOCAL.direccion)}&output=embed"></iframe></div>
      </div>`;
    }
    return `<section id="${esc(s.id)}"><div class="wrap">
      ${s.eyebrow ? `<p class="eyebrow">${esc(s.eyebrow)}</p>` : ""}
      <h2>${esc(s.titulo)}</h2>${cuerpo}
    </div></section>`;
  };

  document.getElementById("contenido").innerHTML = LOCAL.secciones.map(armar).join("");

  document.getElementById("pieTitulo").textContent = LOCAL.pieTitulo;
  document.getElementById("pieTexto").textContent  = LOCAL.pieTexto;
  const pb = document.getElementById("pieBtn");
  pb.textContent = LOCAL.telefonoLindo || LOCAL.telefono;
  pb.href = linkTel;
  document.getElementById("credito").textContent = LOCAL.credito || "";
})();
</script>
</body>
</html>
